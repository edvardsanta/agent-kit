name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests

  package:
    name: Package (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip wheel . --no-deps --wheel-dir wheelhouse
      - run: python -m pip install --no-index --find-links wheelhouse agent-kit
      - run: python tests/package_smoke.py

  installer:
    name: Installer (${{ matrix.os }}, ${{ matrix.installer }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        installer: [venv, pipx]
    env:
      AGENT_KIT_SOURCE: ${{ github.workspace }}
      AGENT_KIT_INSTALLER: ${{ matrix.installer }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - if: runner.os != 'Windows'
        run: |
          sh install.sh
          export PATH="$HOME/.local/bin:$PATH"
          agent-kit --version
          agent-init --help > /dev/null
          agent-kit uninstall --yes
          hash -r
          if command -v agent-kit; then exit 1; fi
          test ! -e "$HOME/.local/share/agent-kit"
      # exactly what users run (`irm ... | iex`), without any PATH fix-up afterwards
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content -Raw install.ps1 | Invoke-Expression
          agent-kit --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          agent-init --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # Windows PowerShell 5.1 is what many machines run; this also covers reinstalling
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-Content -Raw install.ps1 | Invoke-Expression
          agent-kit --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          agent-kit uninstall --yes
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Sleep -Seconds 15  # deletion finishes in a detached process
          if (Get-Command agent-kit -ErrorAction SilentlyContinue) { throw 'agent-kit is still on PATH' }
          if (Test-Path "$env:LOCALAPPDATA\agent-kit") { throw 'the installer venv was not removed' }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -like '*agent-kit\bin*') {
            throw 'the user PATH entry was not removed'
          }
